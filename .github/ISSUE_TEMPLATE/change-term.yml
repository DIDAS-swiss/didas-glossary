name: Change to existing term
description: Request a modification of an existing term or definition
title: "[Change] "
labels: ["glossary", "modification of term", "proposal"]
assignees:
  - jonpetersathan
body:
  - type: input
    id: term
    attributes:
      label: Existing term
      description: The term as it currently appears in the glossary
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Proposed change
      description: What should change, and what should the new text say?
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Rationale and sources
      description: Why is the change needed? Include links to sources, standards or legal texts, and name the normative space of each source (ToIP / Swiss law & Swiss Profiles / eIDAS 2 & EU ARF) per the scope separation in GOVERNANCE.md. Changed or added swiyu statements need a Swiss source with section.
    validations:
      required: true
  - type: dropdown
    id: scope-impact
    attributes:
      label: Does the change touch the normative scope separation?
      description: Per GOVERNANCE.md, "Normative scope separation"
      options:
        - "No — wording only, same sources"
        - "Yes — adds or changes a swiyu statement (Swiss Profile / Trust Protocol / BGEID section cited)"
        - "Yes — adds or changes an eIDAS 2 / EU ARF mapping line (labelled, classified, with does-not-imply)"
        - "Yes — the ToIP relation changes (tier ruling needed)"
        - "Not sure"
    validations:
      required: true
  - type: dropdown
    id: tier-impact
    attributes:
      label: Does this change the term's tier?
      description: "Tiers per GOVERNANCE.md: 1 = adopted from ToIP, 2 = extended, 3 = own"
      options:
        - "No — same tier"
        - "Yes — should become Tier 1 (adopt ToIP as-is)"
        - "Yes — should become Tier 2 (extend ToIP)"
        - "Yes — should become Tier 3 (own definition)"
        - "Not sure"
    validations:
      required: true
  - type: textarea
    id: aliases
    attributes:
      label: Alias changes (optional)
      description: Any additions or corrections to the DE/FR/IT aliases.
